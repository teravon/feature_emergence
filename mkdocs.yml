site_name: Interpreting Feature Emergence in Deep Learning-based SCA
site_url: https://teravon.github.io/feature_emergence/
repo_url: https://github.com/teravon/feature_emergence

theme:
  name: material

docs_dir: docs

nav:
  - Home: README.md
  - 1. Secrets that leak: 01_secrets_that_leak.md
  - 2. Intermediate values: 02_intermediate_values.md
  - 3. Masking: 03_masking.md
  - 4. The datasets: 04_the_datasets.md
  - "4.1 Data exploration (notebook)": notebooks/01_the_data.ipynb
  - 5. The network: 05_the_network.md
  - 6. Training and checkpoints: 06_training_and_checkpoints.md
  - "5–6 Models (notebook)": notebooks/02_the_models.ipynb
  - 7. Scoring the attack: 07_scoring_the_attack.md
  - "7.1 The attack (notebook)": notebooks/03_the_attack.ipynb
  - 8. Perceived Information: 08_perceived_information.md
  - "8.1 PI curves (notebook)": notebooks/04_perceived_information.ipynb
  - "Appendix: Datasets guide": appendix_datasets.md

plugins:
  - mkdocs-jupyter

markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
